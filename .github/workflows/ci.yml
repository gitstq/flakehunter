name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: gofmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Verify formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::These files need gofmt: $out"
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./... -race -count=1

  smoke:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    needs: [fmt, vet, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build -trimpath -o flakehunter .
      - name: Scan bundled samples
        run: ./flakehunter scan testdata
      - name: Init and record three runs
        run: |
          ./flakehunter init
          ./flakehunter record testdata
          ./flakehunter record testdata
          ./flakehunter record testdata
      - name: Report from history
        run: ./flakehunter report
      - name: Quality gate
        run: ./flakehunter gate --max-flake-rate 100
